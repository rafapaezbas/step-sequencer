name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            arch: x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - target: darwin-x64
            runner: macos-latest
            arch: x86_64
          - target: darwin-arm64
            runner: macos-latest
            arch: arm64
          - target: win32-x64
            runner: windows-latest
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      NOTARIZE: ${{ startsWith(matrix.target, 'darwin-') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ matrix.target }}-${{ hashFiles('makefile') }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make release
          tar -czf build/step-sequencer-${{ matrix.target }}.tar.gz -C build step-sequencer

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          make release
          zip -j build/step-sequencer-${{ matrix.target }}.zip build/step-sequencer.exe

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: make app

      - name: Import signing certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::error::MACOS_CERTIFICATE secret is empty or not set"
            exit 1
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "decoded certificate: $(wc -c < "$RUNNER_TEMP/certificate.p12") bytes, $(file -b "$RUNNER_TEMP/certificate.p12")"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Sign
        if: env.NOTARIZE == 'true'
        run: |
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" build/StepSequencer.app
          codesign --verify --strict --verbose=2 build/StepSequencer.app

      - name: Notarize
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/StepSequencer.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple build/StepSequencer.app
          rm build/notarize.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/StepSequencer.app build/step-sequencer-${{ matrix.target }}.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: step-sequencer-${{ matrix.target }}
          path: |
            build/step-sequencer-${{ matrix.target }}.zip
            build/step-sequencer-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Remove keychain
        if: always() && env.NOTARIZE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
